version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Kept as a single && command on purpose: the Amplify console's
            # auto-detect collapses a multi-command build phase into one field
            # and silently keeps only the last line.
            #
            # ponytail: optimize-images.mjs reads its sources from public/images,
            # and Vite copies all of public/ into dist — so ~226 MB of PNG/JPG
            # originals ride along that nothing references (86 .webp refs in src,
            # 0 local png/jpg refs). Dropping them here takes the deployed
            # artifact from 244 MB to 18 MB. Upgrade path: move the originals to
            # a non-served folder and point optimize-images.mjs at it, then this
            # line can go.
            - npm run build && find dist/images -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -delete
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    customHeaders:
      # Amplify's default for every file is `public, max-age=0, s-maxage=31536000`:
      # its CDN caches for a year (fine — a deploy invalidates it) but the browser
      # revalidates on every request. For Vite's content-hashed chunks that is a
      # wasted conditional request per chunk per page view, and the hash already
      # guarantees a new filename whenever the content changes.
      - pattern: '/assets/**'
        headers:
          - key: Cache-Control
            value: 'public, max-age=31536000, immutable'
      # Images are stable-named (gallery-01.webp), so they get a day rather than
      # a year — long enough to matter, short enough that replacing one lands.
      - pattern: '/images/**'
        headers:
          - key: Cache-Control
            value: 'public, max-age=86400'
