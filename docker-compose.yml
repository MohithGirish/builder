services:

  # Frontend runs locally via `cd frontend && npm run dev` (port 3000) — not containerized.

  # ai_service (Python/FastAPI matchmaking engine) is not deployed: the backend has
  # no call site for it yet. Source lives in ./ai_service; run it standalone with
  # `uvicorn app.main:app --port 8000`. Re-add a service block here once it's wired in.

  # ── Backend API ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: builder_ai_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      # Required by the admin seeder (npm run db:seed). Supply via host env or
      # backend/.env; seeding throws loudly if either is unset.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - builder_net
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: builder_ai_postgres
    environment:
      POSTGRES_USER:     builder_admin
      POSTGRES_PASSWORD: builder_secret_dev
      POSTGRES_DB:       builder_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - builder_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder_admin -d builder_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: builder_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - builder_net
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:

networks:
  builder_net:
    driver: bridge
