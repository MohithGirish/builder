databases:
  - name: builder-ai-db
    databaseName: builder_ai_db
    user: builder_admin
    plan: free

services:
  # ── Backend (Node.js / Express + Socket.io) ──────────────────────────────────
  - type: web
    name: builder-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No dockerCommand override: the Dockerfile's production stage runs
    # `npm run db:migrate && npm run db:seed && node src/server.js`, so
    # migrations and pending seeders apply on deploy (seeders are tracked in
    # SequelizeData and only run once).
    buildFilter:
      paths:
        - backend/**
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: builder-ai-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_SECONDS
        value: "604800"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: ALLOWED_ORIGINS
        value: https://builder-475m.onrender.com    # ← your real FRONTEND Render URL
      - key: FRONTEND_URL
        value: https://builder-475m.onrender.com    # ← same frontend URL (used in quote email deep-links)
      - key: EMAIL_USER
        sync: false                                  # set in Render dashboard: Gmail address
      - key: EMAIL_PASS
        sync: false                                  # set in Render dashboard: Gmail 16-char app password
      - key: ANTHROPIC_API_KEY
        sync: false                                  # optional: enables the AI onboarding chat

  # ── AI Matchmaking Microservice (Python / FastAPI) ────────────────────────────
  - type: web
    name: builder-ai-engine
    runtime: docker
    rootDir: ai_service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          name: builder-ai-backend
          type: web
          property: host
          envVarKey: ALLOWED_ORIGINS

  # ── Frontend (React / Vite — static site) ────────────────────────────────────
  - type: web
    name: builder-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://builder-backend-i7ix.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Empty ⇒ same-origin. The /api/* rewrite above proxies REST calls to the
      # backend, so the browser never needs a cross-origin URL with a scheme.
      - key: VITE_BACKEND_URL
        value: ""
